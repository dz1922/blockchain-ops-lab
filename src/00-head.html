<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validator Operations Lab</title>
<meta name="description" content="Hands-on labs for running blockchain validators: a simulated terminal, a simulated chain and production-style alerts, in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101410'/%3E%3Cpath d='M7 11l5 5-5 5' stroke='%23b6f23a' stroke-width='2.5' fill='none'/%3E%3Cpath d='M15 21h10' stroke='%23f5a623' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0f0d; --panel:#111714; --panel-2:#161e1a; --panel-3:#1d2722; --line:#26312b; --line-2:#34413a;
  --ink:#e8f0e4; --ink-2:#b9c7b4; --ink-3:#7f9180; --lime:#b6f23a; --lime-d:#8fc21f; --amber:#f5a623; --red:#ff6b57; --blue:#7cc4ff;
  --f-display:'Archivo','Noto Sans SC',system-ui,sans-serif; --f-body:'Hanken Grotesk','Noto Sans SC',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
code{font-family:var(--f-mono);font-size:.86em;background:var(--panel-3);border:1px solid var(--line-2);border-radius:5px;padding:.05em .35em;color:var(--ink);word-break:break-word}
b{color:var(--ink)}
button{font:inherit;cursor:pointer}
.mono{font-family:var(--f-mono)}
/* ---------- landing ---------- */
.topnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:2.4rem}
.brand{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.06em;color:var(--ink-2)}
.brand b{color:var(--lime)}
.lang{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:var(--ink-3);font-family:var(--f-mono);font-size:.72rem;padding:.3rem .6rem}
.lang button.on{background:var(--panel-3);color:var(--ink)}
.meta-line{font-family:var(--f-mono);font-size:.76rem;color:var(--ink-3);display:flex;gap:1.2rem;flex-wrap:wrap}
.how{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.how div{border-top:1px solid var(--line-2);padding-top:.8rem}
.how h4{font-size:.95rem;margin-bottom:.25rem}
.how p{font-size:.88rem;color:var(--ink-2)}
.module{margin-top:2.8rem}
.module-h{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.4rem}
.module-h h2{font-family:var(--f-display);font-size:1.45rem}
.logo{display:inline-flex;flex:none;vertical-align:middle}.logo svg{width:100%;height:100%;display:block}.logo i{width:60%;height:60%;margin:auto;border-radius:50%}
.card .lab{display:flex;align-items:center;gap:.4rem}
#mech-net{display:inline-flex;align-items:center;gap:.35rem}
.module p.desc{color:var(--ink-2);max-width:72ch;margin-bottom:1rem;font-size:.95rem}
.card ul{margin:.1rem 0 0 1rem;padding:0;font-size:.84rem;color:var(--ink-2);display:grid;gap:.15rem}
.card .lab{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3)}
.plan{display:flex;gap:.6rem;flex-wrap:wrap}

#home{min-height:100%;padding:clamp(1.5rem,5vw,4rem) clamp(1rem,5vw,4rem);max-width:1240px;margin:0 auto}
.home-hero{display:grid;gap:1.2rem;margin-bottom:2.6rem;position:relative}
.home-hero .tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;color:var(--lime);text-transform:uppercase}
.home-hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(2.2rem,1.4rem + 3.6vw,4rem);line-height:1.03;letter-spacing:-.02em}
.home-hero h1 em{font-style:normal;color:var(--lime)}
.home-hero p{max-width:66ch;color:var(--ink-2);font-size:1.06rem}
.home-term{font-family:var(--f-mono);font-size:.82rem;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;color:var(--ink-2);max-width:640px;white-space:pre-wrap}
.home-term .p{color:var(--lime)}
.nets{display:flex;gap:.6rem;flex-wrap:wrap;margin:0 0 1rem}
.net-chip{font-family:var(--f-mono);font-size:.74rem;border:1px solid var(--line-2);border-radius:999px;padding:.3rem .8rem;color:var(--ink-2);display:inline-flex;gap:.5rem;align-items:center}
.net-chip i{width:9px;height:9px;border-radius:50%}
.net-chip.soon{opacity:.5;border-style:dashed}
.cards{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.25rem 1.1rem;display:grid;gap:.55rem;align-content:start;text-align:left;color:var(--ink);transition:border-color .2s,transform .2s;position:relative;overflow:hidden}
.card:hover{border-color:var(--lime);transform:translateY(-2px)}
.card .c-net{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between}
.card h3{font-family:var(--f-display);font-size:1.18rem;line-height:1.3}
.card p{font-size:.9rem;color:var(--ink-2)}
.card .c-meta{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);display:flex;gap:1rem}
.card .c-done{position:absolute;top:.9rem;right:1rem;font-family:var(--f-mono);font-size:.68rem;color:var(--lime)}
.home-sec{margin-top:3rem}
.home-sec h2{font-family:var(--f-display);font-size:1.4rem;margin-bottom:.8rem}
.arch{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.arch div{border:1px solid var(--line);border-radius:12px;padding:1rem;background:var(--panel)}
.arch h4{font-size:.95rem;margin-bottom:.3rem}
.arch p{font-size:.86rem;color:var(--ink-2)}
.foot{margin-top:3rem;font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);border-top:1px solid var(--line);padding-top:1rem}
/* ---------- play ---------- */
#play{display:none;height:100%;grid-template-rows:auto 1fr;}
#play.on{display:grid}
.bar-top{display:flex;align-items:center;gap:.8rem;padding:.55rem .9rem;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.bar-top .back{background:none;border:1px solid var(--line-2);color:var(--ink-2);border-radius:8px;padding:.3rem .7rem;font-family:var(--f-mono);font-size:.74rem}
.bar-top .ttl{font-family:var(--f-display);font-weight:800;font-size:1rem;display:flex;gap:.6rem;align-items:center;min-width:0}
.bar-top .sp{flex:1}
.clock{font-family:var(--f-mono);font-size:.82rem;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:.3rem .7rem}
.speeds{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.speeds button{background:none;border:0;border-right:1px solid var(--line-2);color:var(--ink-3);font-family:var(--f-mono);font-size:.72rem;padding:.32rem .6rem}
.speeds button:last-child{border-right:0}
.speeds button.on{background:var(--lime);color:#0b0f0d;font-weight:700}
.tb{background:none;border:1px solid var(--line-2);color:var(--ink-2);border-radius:8px;padding:.3rem .7rem;font-family:var(--f-mono);font-size:.74rem}
.tb:hover,.back:hover{border-color:var(--lime);color:var(--lime)}
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr);min-height:0}
@media(max-width:980px){.main{grid-template-columns:minmax(0,1fr);grid-template-rows:60vh auto}#play{height:auto}}
@media(max-width:600px){.an-row{grid-template-columns:auto 1fr auto 1fr}.bar-top .ttl{font-size:.9rem}.speeds button{padding:.32rem .45rem}}
.side,.box,.feed,.alerts{min-width:0}.ev .x,.al-i{word-break:break-word;overflow-wrap:anywhere}
/* terminal */
.term{background:#070a08;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;font-family:var(--f-mono);font-size:13px;line-height:1.5}
.term-out{flex:1;overflow-y:auto;padding:.9rem 1rem 0;white-space:pre-wrap;word-break:break-word;color:#d7e3d2;cursor:text}
.term-in{display:flex;align-items:baseline;padding:0 1rem 1rem;white-space:pre}
.term-out .t-in{display:block}
.term-in input{flex:1;background:none;border:0;outline:0;color:#f0f7ea;font:inherit;caret-color:var(--lime);padding:0;min-width:2ch}
.term-busy{color:var(--ink-3);padding:0 1rem 1rem;display:none}
.a-b{font-weight:700}.a-r{color:#ff7b6b}.a-g{color:#9be05a}.a-y{color:#f5c04a}.a-bl{color:#7cb7ff}.a-m{color:#d69cff}.a-c{color:#6fd6d6}.a-k{color:#738478}
/* right column */
.side{display:flex;flex-direction:column;min-height:0;overflow-y:auto;background:var(--bg)}
.box{border-bottom:1px solid var(--line);padding:.8rem .95rem}
.box-h{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;display:flex;justify-content:space-between;margin-bottom:.55rem}
.mech-head{display:flex;gap:.7rem;align-items:baseline;flex-wrap:wrap;margin-bottom:.6rem}
.mh-k{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3)}
.mh-v{font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--lime)}
.mh-v.warn{color:var(--amber)}.mh-v.bad{color:var(--red)}
.mh-s{font-size:.78rem;color:var(--ink-3)}
.mech-note{font-size:.72rem;color:var(--ink-3);margin-top:.5rem;line-height:1.5}
.avx-grid{display:grid;gap:.5rem}
.avx-node,.sol-node{border:1px solid var(--line);border-radius:10px;padding:.55rem .65rem;background:var(--panel)}
.avx-node.bad,.sol-node.bad{border-color:#5a2a24}.avx-node.warn,.sol-node.warn{border-color:#5b4519}.avx-node.ok,.sol-node.ok{border-color:#2f4a1b}
.an-top{display:flex;align-items:center;gap:.5rem}
.an-top b{font-family:var(--f-mono)}
.an-reg{font-family:var(--f-mono);font-size:.68rem;color:var(--ink-3)}
.pill{margin-left:auto;font-family:var(--f-mono);font-size:.64rem;padding:.08rem .45rem;border-radius:5px;border:1px solid var(--line-2);color:var(--ink-2)}
.pill.ok{color:var(--lime);border-color:#3e5b1b}.pill.warn{color:var(--amber);border-color:#6b5017}.pill.bad{color:var(--red);border-color:#6b2c24}
.an-row{display:grid;grid-template-columns:auto auto auto auto auto auto;gap:.15rem .55rem;font-size:.7rem;color:var(--ink-3);margin-top:.35rem;align-items:baseline}
.an-row b{font-size:.76rem;color:var(--ink)}
.okc{color:var(--lime)!important}.badc{color:var(--red)!important}.warnc{color:var(--amber)!important}
.bar,.ubar{height:6px;border-radius:99px;background:var(--panel-3);margin-top:.45rem;position:relative;overflow:visible}
.bar i,.ubar i{display:block;height:100%;border-radius:99px;background:var(--lime);transition:width .3s}
.bar i.w,.ubar i.w{background:var(--amber)}.bar i.b,.ubar i.b{background:var(--red)}
.bar em,.ubar em{position:absolute;top:-3px;width:2px;height:12px;background:var(--amber)}
.bar em.r,.ubar em{background:var(--red)}
.ubar span{position:absolute;right:0;top:-1.25rem;font-family:var(--f-mono);font-size:.62rem;color:var(--ink-3)}
.ubar{margin-top:1.3rem}
.sol-gauges{display:grid;gap:.6rem;margin-bottom:.6rem}
.sol-gauges .g{border:1px solid var(--line);border-radius:10px;padding:.5rem .65rem;background:var(--panel);display:grid;gap:.1rem}
.sol-gauges .k{font-family:var(--f-mono);font-size:.66rem;color:var(--ink-3)}
.sol-gauges b{font-family:var(--f-display);font-size:1.15rem}
.sol-gauges .s{font-size:.7rem;color:var(--ink-3)}
.sol-nodes{display:grid;gap:.4rem}
/* alerts */
.alerts{display:grid;gap:.5rem}
.al{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:.55rem .65rem;font-size:.8rem;position:relative}
.al.crit{border-color:#6b2c24;background:#1a1311}.al.warn{border-color:#5b4519}.al.res{opacity:.5}
.al-h{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.al-h b{font-family:var(--f-mono);font-size:.8rem}
.sev{font-family:var(--f-mono);font-size:.6rem;padding:.05rem .4rem;border-radius:4px;font-weight:700;text-transform:uppercase}
.sev.critical{background:var(--red);color:#1a0b08}.sev.warning{background:#5b4519;color:#ffd58a}
.al-i{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-2);margin-top:.25rem}
.al-i span{color:var(--ink-3)}
.al-f{display:flex;gap:.5rem;align-items:center;margin-top:.45rem;flex-wrap:wrap;font-size:.72rem;color:var(--ink-3)}
.ack{background:#5b5fc7;color:#fff;border:0;border-radius:6px;padding:.25rem .7rem;font-size:.74rem;font-weight:600}
.ack:hover{background:#6e72e0}
.call{color:var(--red);font-family:var(--f-mono)}
.empty{font-size:.8rem;color:var(--ink-3)}
/* objectives */
.obj li{list-style:none;display:grid;grid-template-columns:1.2rem 1fr;gap:.4rem;font-size:.82rem;color:var(--ink-2);padding:.15rem 0}
.obj li.ok{color:var(--ink)}
.obj li .m{font-family:var(--f-mono)}
.obj li.ok .m{color:var(--lime)}
.obj li.no .m{color:var(--red)}
.obj ul{padding:0}
.obj .sub{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;color:var(--ink-3);margin-top:.5rem;text-transform:uppercase}
.hold{height:4px;border-radius:99px;background:var(--panel-3);margin-top:.5rem;overflow:hidden}
.hold i{display:block;height:100%;background:var(--lime);width:0}
/* feed */
.feed{display:grid;gap:.35rem;font-size:.78rem}
.ev{display:grid;grid-template-columns:3.8rem 1fr;gap:.5rem;color:var(--ink-2);line-height:1.5}
.ev .t{font-family:var(--f-mono);font-size:.66rem;color:var(--ink-3);padding-top:.12rem}
.ev.alert .x{color:#ffb4a8}.ev.ok .x{color:#cfeaa8}.ev.bad .x{color:var(--red)}.ev.call .x{color:#ff9f8f;font-weight:600}.ev.warn .x{color:#f3cf8a}
.ev.lesson .x{background:var(--panel-2);border:1px solid #3e5b1b;border-radius:8px;padding:.45rem .6rem;color:var(--ink)}
.ev.lesson .x b{color:var(--lime)}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(4,7,5,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:1rem}
.ov.on{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line-2);border-radius:16px;max-width:640px;width:100%;max-height:92vh;overflow-y:auto;padding:1.5rem 1.6rem}
.dlg .k{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;color:var(--lime);text-transform:uppercase}
.dlg h2{font-family:var(--f-display);font-size:1.6rem;line-height:1.2;margin:.3rem 0 .8rem}
.dlg p{color:var(--ink-2);margin:.55rem 0}
.dlg ul{margin:.4rem 0 .6rem 1.1rem;color:var(--ink-2);display:grid;gap:.25rem;font-size:.92rem}
.dlg .row{display:flex;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap}
.btn{background:var(--lime);color:#0b0f0d;border:0;border-radius:10px;padding:.6rem 1.2rem;font-weight:700}
.btn.ghost{background:none;border:1px solid var(--line-2);color:var(--ink-2)}
.score{width:100%;border-collapse:collapse;margin:.8rem 0;font-size:.88rem}
.score td{padding:.4rem .2rem;border-bottom:1px solid var(--line);color:var(--ink-2)}
.score td:last-child{text-align:right;font-family:var(--f-mono);color:var(--ink)}
.score td.good{color:var(--lime)}.score td.mid{color:var(--amber)}.score td.bad{color:var(--red)}
.grade{font-family:var(--f-display);font-weight:900;font-size:3rem;line-height:1;float:right;color:var(--lime)}
.grade.F{color:var(--red)}.grade.C{color:var(--amber)}
.toast{position:fixed;right:1rem;bottom:1rem;background:#3a1410;border:1px solid var(--red);color:#ffd9d2;border-radius:12px;padding:.8rem 1rem;font-size:.85rem;z-index:40;display:none;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast.on{display:block;animation:ring .5s ease-in-out 3}
@keyframes ring{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.toast.on{animation:none}}
</style>
</head>
<body>
